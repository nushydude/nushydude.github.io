<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Top bar -->
  <rect width="1280" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#eef0f3"/>
  <text x="24" y="40" fill="#0f172a" font-size="20" font-weight="700">Fiscava</text>
  <rect x="112" y="22" width="44" height="20" rx="10" fill="#eef2ff"/>
  <text x="134" y="36" fill="#4f46e5" font-size="11" font-weight="600" text-anchor="middle">Free</text>
  <rect x="380" y="16" width="520" height="32" rx="16" fill="#f1f5f9"/>
  <text x="404" y="36" fill="#94a3b8" font-size="13">Search or jump to…</text>
  <circle cx="1250" cy="32" r="16" fill="#2563eb"/>
  <text x="1250" y="37" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">SU</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="256" height="656" fill="#ffffff"/>
  <line x1="256" y1="64" x2="256" y2="720" stroke="#eef0f3"/>
  <text x="24" y="108" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">FINANCIAL OVERVIEW</text>
  <text x="44" y="143" fill="#475569" font-size="14">Dashboard</text>
  <rect x="12" y="160" width="232" height="36" rx="9" fill="#eff6ff"/>
  <text x="44" y="183" fill="#2563eb" font-size="14" font-weight="600">Insights</text>
  <text x="44" y="219" fill="#475569" font-size="14">Net Worth</text>
  <text x="44" y="255" fill="#475569" font-size="14">Forecasts</text>
  <text x="24" y="300" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TRACK MONEY</text>
  <text x="44" y="332" fill="#475569" font-size="14">Expenses</text>
  <text x="44" y="368" fill="#475569" font-size="14">Income</text>
  <text x="44" y="404" fill="#475569" font-size="14">Categories</text>
  <text x="24" y="449" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">PLANNING</text>
  <text x="44" y="481" fill="#475569" font-size="14">Savings Goals</text>
  <text x="44" y="517" fill="#475569" font-size="14">Debt Accounts</text>
  <text x="24" y="562" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">INVESTMENTS</text>
  <text x="44" y="594" fill="#475569" font-size="14">Portfolio</text>

  <!-- Main -->
  <text x="288" y="102" fill="#94a3b8" font-size="13">Home › Chat</text>
  <text x="288" y="134" fill="#0f172a" font-size="26" font-weight="700">Ask Fiscava</text>

  <!-- user 1 -->
  <rect x="928" y="156" width="320" height="42" rx="14" fill="#2563eb"/>
  <text x="1232" y="182" fill="#ffffff" font-size="14" text-anchor="end">I want to buy a $4,000 laptop</text>

  <!-- assistant 1 -->
  <rect x="288" y="212" width="430" height="46" rx="14" fill="#ffffff" stroke="#eef0f3"/>
  <text x="308" y="240" fill="#0f172a" font-size="14">Got it. I'll treat the laptop as the current topic.</text>

  <!-- user 2 -->
  <rect x="1068" y="272" width="180" height="42" rx="14" fill="#2563eb"/>
  <text x="1232" y="298" fill="#ffffff" font-size="14" text-anchor="end">Can I afford it?</text>

  <!-- assistant 2 -->
  <rect x="288" y="328" width="560" height="100" rx="14" fill="#ffffff" stroke="#eef0f3"/>
  <text x="308" y="358" fill="#0f172a" font-size="14">Yes. Based on your balances and goals, this stays manageable —</text>
  <text x="308" y="382" fill="#0f172a" font-size="14">it's about 3% of net worth and keeps your emergency fund on</text>
  <text x="308" y="406" fill="#0f172a" font-size="14">track. Want me to plan it as a one-off or save toward it?</text>

  <!-- using your data -->
  <text x="288" y="464" fill="#64748b" font-size="13">Using your data:</text>
  <rect x="392" y="450" width="92" height="22" rx="11" fill="#eff6ff"/>
  <circle cx="408" cy="461" r="4" fill="#2563eb"/>
  <text x="420" y="465" fill="#1d4ed8" font-size="12">Accounts</text>
  <rect x="494" y="450" width="92" height="22" rx="11" fill="#f0fdf4"/>
  <circle cx="510" cy="461" r="4" fill="#16a34a"/>
  <text x="522" y="465" fill="#15803d" font-size="12">Expenses</text>
  <rect x="596" y="450" width="72" height="22" rx="11" fill="#faf5ff"/>
  <circle cx="612" cy="461" r="4" fill="#9333ea"/>
  <text x="624" y="465" fill="#7e22ce" font-size="12">Goals</text>

  <!-- talking about -->
  <rect x="288" y="486" width="960" height="56" rx="12" fill="#ffffff" stroke="#eef0f3"/>
  <text x="310" y="510" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TALKING ABOUT</text>
  <text x="310" y="530" fill="#0f172a" font-size="14" font-weight="600">Laptop ($4,000)</text>

  <!-- input -->
  <rect x="288" y="556" width="960" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="312" y="586" fill="#94a3b8" font-size="14">Ask about your spending, goals, debt, or anything else…</text>
  <circle cx="1222" cy="581" r="18" fill="#2563eb"/>
  <path d="M1214 581 L1230 581 M1224 575 L1230 581 L1224 587" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- suggestions -->
  <rect x="288" y="626" width="180" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="378" y="645" fill="#475569" font-size="12" text-anchor="middle">Can I afford something?</text>
  <rect x="480" y="626" width="160" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="645" fill="#475569" font-size="12" text-anchor="middle">Improve my savings</text>
  <rect x="652" y="626" width="160" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="732" y="645" fill="#475569" font-size="12" text-anchor="middle">Reduce my spending</text>
  <rect x="824" y="626" width="160" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="904" y="645" fill="#475569" font-size="12" text-anchor="middle">Understand my debt</text>

  <text x="768" y="690" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">↗ POWERED BY FISCAVA AI</text>
</svg>
