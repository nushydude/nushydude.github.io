  <rect x="852" y="22" width="36" height="20" rx="6" fill="#e2e8f0"/>
  <text x="870" y="36" fill="#64748b" font-size="11" text-anchor="middle">⌘K</text>
  <circle cx="1250" cy="32" r="16" fill="#2563eb"/>
  <text x="1250" y="37" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">SU</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="256" height="656" fill="#ffffff"/>
  <line x1="256" y1="64" x2="256" y2="720" stroke="#eef0f3"/>

  <text x="24" y="108" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">FINANCIAL OVERVIEW</text>
  <rect x="12" y="120" width="232" height="36" rx="9" fill="#eff6ff"/>
  <text x="44" y="143" fill="#2563eb" font-size="14" font-weight="600">Dashboard</text>
  <text x="44" y="183" fill="#475569" font-size="14">Insights</text>
  <text x="44" y="219" fill="#475569" font-size="14">Net Worth</text>
  <text x="44" y="255" fill="#475569" font-size="14">Forecasts</text>

  <text x="24" y="300" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TRACK MONEY</text>
  <text x="44" y="332" fill="#475569" font-size="14">Expenses</text>
  <text x="44" y="368" fill="#475569" font-size="14">Income</text>
  <text x="44" y="404" fill="#475569" font-size="14">Categories</text>

  <text x="24" y="449" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">PLANNING</text>
  <text x="44" y="481" fill="#475569" font-size="14">Savings Goals</text>
  <text x="44" y="517" fill="#475569" font-size="14">Debt Accounts</text>

  <text x="24" y="562" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">INVESTMENTS</text>
  <text x="44" y="594" fill="#475569" font-size="14">Portfolio</text>

  <!-- Main -->
  <text x="288" y="112" fill="#0f172a" font-size="28" font-weight="700">Dashboard</text>
  <text x="288" y="138" fill="#64748b" font-size="14">A clear read on where your money is, not just where it went.</text>

  <!-- KPI cards (sample data) -->
  <g>
    <rect x="288" y="160" width="228" height="100" rx="12" fill="#ffffff" stroke="#eef0f3"/>
    <text x="308" y="190" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">NET WORTH</text>
    <text x="308" y="222" fill="#0f172a" font-size="24" font-weight="700">$128,500</text>
    <text x="308" y="244" fill="#16a34a" font-size="12">▲ 2.4% this month</text>

    <rect x="532" y="160" width="228" height="100" rx="12" fill="#ffffff" stroke="#eef0f3"/>
    <text x="552" y="190" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">SPENT THIS MONTH</text>
    <text x="552" y="222" fill="#0f172a" font-size="24" font-weight="700">$3,240</text>
    <text x="552" y="244" fill="#64748b" font-size="12">of $4,000 budget</text>

    <rect x="776" y="160" width="228" height="100" rx="12" fill="#ffffff" stroke="#eef0f3"/>
    <text x="796" y="190" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">SAVINGS RATE</text>
    <text x="796" y="222" fill="#0f172a" font-size="24" font-weight="700">24%</text>
    <text x="796" y="244" fill="#16a34a" font-size="12">▲ up from 19%</text>

    <rect x="1020" y="160" width="228" height="100" rx="12" fill="#ffffff" stroke="#eef0f3"/>
    <text x="1040" y="190" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">SAFE TO SPEND</text>
    <text x="1040" y="222" fill="#0f172a" font-size="24" font-weight="700">$1,180</text>
    <text x="1040" y="244" fill="#64748b" font-size="12">until 30 Jun</text>
  </g>

  <!-- Net worth chart -->
  <rect x="288" y="284" width="612" height="312" rx="12" fill="#ffffff" stroke="#eef0f3"/>
  <text x="312" y="320" fill="#0f172a" font-size="16" font-weight="700">Net worth · last 12 months</text>
  <text x="876" y="320" fill="#16a34a" font-size="13" font-weight="600" text-anchor="end">+18.6%</text>
  <line x1="312" y1="540" x2="876" y2="540" stroke="#eef0f3"/>
  <path d="M328 512 L400 498 L472 482 L544 470 L616 444 L688 420 L760 398 L832 372 L876 358 L876 540 L328 540 Z" fill="#dbeafe" fill-opacity="0.7"/>
  <polyline points="328,512 400,498 472,482 544,470 616,444 688,420 760,398 832,372 876,358" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="328" y="564" fill="#94a3b8" font-size="11">Jul</text>
  <text x="600" y="564" fill="#94a3b8" font-size="11" text-anchor="middle">Jan</text>
  <text x="872" y="564" fill="#94a3b8" font-size="11" text-anchor="end">Jun</text>

  <!-- Insight card -->
  <rect x="924" y="284" width="324" height="148" rx="12" fill="#ffffff" stroke="#eef0f3"/>
  <rect x="948" y="308" width="60" height="22" rx="11" fill="#fef3c7"/>
  <text x="978" y="323" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">INSIGHT</text>
  <text x="948" y="360" fill="#0f172a" font-size="14" font-weight="600">Dining is 18% above</text>
  <text x="948" y="382" fill="#0f172a" font-size="14" font-weight="600">your 3-month average.</text>
  <text x="948" y="410" fill="#64748b" font-size="13">$420 vs ~$355 typical.</text>

  <!-- Goal card -->
  <rect x="924" y="448" width="324" height="148" rx="12" fill="#ffffff" stroke="#eef0f3"/>
  <text x="948" y="484" fill="#0f172a" font-size="15" font-weight="700">Goal · Emergency fund</text>
  <text x="948" y="510" fill="#64748b" font-size="13">$6,800 of $10,000</text>
  <rect x="948" y="528" width="276" height="10" rx="5" fill="#eef2ff"/>
  <rect x="948" y="528" width="188" height="10" rx="5" fill="#2563eb"/>
  <text x="948" y="566" fill="#16a34a" font-size="13" font-weight="600">68% — on track for October</text>
</svg>
