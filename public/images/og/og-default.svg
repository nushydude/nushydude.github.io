<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091120"/>
      <stop offset="0.55" stop-color="#050816"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(90, 150)">
    <circle cx="9" cy="2" r="9" fill="url(#accent)"/>
    <text x="34" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#7dd3fc" font-weight="700">ANUSHA DHARMASENA</text>

    <text x="0" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" fill="#ffffff" font-weight="700">Building practical</text>
    <text x="0" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" fill="#ffffff" font-weight="700">digital products.</text>

    <text x="0" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">Tech lead and product-minded builder — finance, household</text>
    <text x="0" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">tooling, and immersive digital experiences.</text>

    <text x="0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#7dd3fc" letter-spacing="2">nushydude.github.io</text>
  </g>
</svg>
